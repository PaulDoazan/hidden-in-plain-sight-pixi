services:
  server:
    image: marche-ou-creve-server:${IMAGE_TAG:-latest}
    container_name: marche-ou-creve-server
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: https://game.marche-ou-creve.com
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
